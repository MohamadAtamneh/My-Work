<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LuxeFashion — Premium Everyday Clothing</title>
    <meta
      name="description"
      content="LuxeFashion curates modern essentials in premium fabrics — clean silhouettes, ethical sourcing, free worldwide shipping, and 30-day returns."
    />
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph (per-page values override these via react-helmet-async) -->
    <meta property="og:site_name" content="LuxeFashion" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LuxeFashion — Premium Everyday Clothing" />
    <meta
      property="og:description"
      content="Modern essentials in premium fabrics. Free worldwide shipping, 30-day returns."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LuxeFashion — Premium Everyday Clothing" />
    <meta
      name="twitter:description"
      content="Modern essentials in premium fabrics. Free worldwide shipping, 30-day returns."
    />

    <!-- Product imagery is served from the Unsplash CDN — connect early -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
